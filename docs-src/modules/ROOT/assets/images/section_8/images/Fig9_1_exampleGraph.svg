<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <!-- Маркер для стрелок -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
    <style>
      .bg { fill: #EFEFEF; }
      .node { fill: #222222; }
      .node-text { fill: #FFFFFF; font-family: monospace, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .edge { stroke: #333333; stroke-width: 1.8; fill: none; }
      .dashed-edge { stroke: #333333; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .label-text { fill: #333333; font-family: monospace, sans-serif; font-size: 13px; }
      .deg-text { fill: #333333; font-family: monospace, sans-serif; font-size: 11px; }
      .title-text { fill: #222222; font-family: monospace, sans-serif; font-size: 15px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Фон -->
  <rect class="bg" width="700" height="450" rx="8" />

  <!-- ================= Левый граф (Undirected) ================= -->
  <g id="undirected-graph">
    <!-- Пунктирный узор для Vertices / Edges -->
    <path d="M 230 40 L 195 55 L 235 90" class="dashed-edge" />
    <text x="210" y="30" class="label-text" text-anchor="middle">Vertices</text>

    <path d="M 90 120 L 40 170 L 100 190" class="dashed-edge" />
    <text x="35" y="150" class="label-text" text-anchor="end">Edges</text>

    <!-- Рёбра -->
    <line x1="100" y1="80" x2="180" y2="50" class="edge" />
    <line x1="180" y1="50" x2="230" y2="85" class="edge" />
    <line x1="180" y1="50" x2="165" y2="100" class="edge" />
    <line x1="180" y1="50" x2="110" y2="170" class="edge" />
    <line x1="100" y1="80" x2="110" y2="170" class="edge" />
    <line x1="230" y1="85" x2="230" y2="160" class="edge" />
    <line x1="230" y1="85" x2="110" y2="170" class="edge" />
    <line x1="165" y1="100" x2="165" y2="235" class="edge" />
    <line x1="110" y1="170" x2="230" y2="160" class="edge" />
    <line x1="110" y1="170" x2="165" y2="235" class="edge" />
    <line x1="230" y1="160" x2="165" y2="235" class="edge" />

    <!-- Вершины -->
    <g transform="translate(100, 80)"><circle r="14" class="node"/><text class="node-text">V₀</text></g>
    <g transform="translate(180, 50)"><circle r="14" class="node"/><text class="node-text">V₁</text></g>
    <g transform="translate(230, 85)"><circle r="14" class="node"/><text class="node-text">V₂</text></g>
    <g transform="translate(165, 100)"><circle r="14" class="node"/><text class="node-text">V₄</text></g>
    <g transform="translate(110, 170)"><circle r="14" class="node"/><text class="node-text">V₆</text></g>
    <g transform="translate(230, 160)"><circle r="14" class="node"/><text class="node-text">V₃</text></g>
    <g transform="translate(165, 235)"><circle r="14" class="node"/><text class="node-text">V₅</text></g>

    <!-- Сравнение u/v под графом -->
    <line x1="100" y1="340" x2="140" y2="300" class="edge" />
    <g transform="translate(100, 340)"><circle r="10" class="node"/><text class="node-text" style="font-size: 11px;">u</text></g>
    <g transform="translate(140, 300)"><circle r="10" class="node"/><text class="node-text" style="font-size: 11px;">v</text></g>

    <text x="160" y="325" class="title-text">=</text>

    <line x1="180" y1="340" x2="220" y2="300" class="edge" />
    <g transform="translate(180, 340)"><circle r="10" class="node"/><text class="node-text" style="font-size: 11px;">v</text></g>
    <g transform="translate(220, 300)"><circle r="10" class="node"/><text class="node-text" style="font-size: 11px;">u</text></g>

    <text x="160" y="400" class="title-text">a). undirected</text>
  </g>

  <!-- ================= Правый граф (Directed) ================= -->
  <g id="directed-graph">
    <!-- Петли (Loops) -->
    <path d="M 490 40 A 12 12 0 1 1 505 50" class="edge" marker-end="url(#arrow)" />
    <path d="M 420 200 A 12 12 0 1 1 405 210" class="edge" marker-end="url(#arrow)" />

    <!-- Направленные рёбра со стрелками -->
    <line x1="435" y1="85" x2="480" y2="60" class="edge" marker-end="url(#arrow)" />
    <line x1="420" y1="95" x2="420" y2="180" class="edge" marker-end="url(#arrow)" />
    <line x1="510" y1="60" x2="555" y2="85" class="edge" marker-end="url(#arrow)" />
    <line x1="500" y1="65" x2="500" y2="130" class="edge" marker-end="url(#arrow)" />
    <line x1="500" y1="130" x2="500" y2="65" class="edge" marker-end="url(#arrow)" />
    <line x1="500" y1="65" x2="560" y2="150" class="edge" marker-end="url(#arrow)" />
    <line x1="570" y1="100" x2="570" y2="150" class="edge" marker-end="url(#arrow)" />
    <line x1="555" y1="160" x2="515" y2="145" class="edge" marker-end="url(#arrow)" />
    <line x1="500" y1="160" x2="500" y2="230" class="edge" marker-end="url(#arrow)" />
    <line x1="430" y1="195" x2="485" y2="155" class="edge" marker-end="url(#arrow)" />
    <line x1="430" y1="200" x2="490" y2="240" class="edge" marker-end="url(#arrow)" />
    <line x1="510" y1="235" x2="560" y2="175" class="edge" marker-end="url(#arrow)" />

    <!-- Подписи степеней (deg=...) -->
    <text x="390" y="85" class="deg-text">(deg=2)</text>
    <text x="465" y="50" class="deg-text">(deg=9)</text>
    <text x="560" y="60" class="deg-text">(deg=2)</text>
    <text x="460" y="135" class="deg-text">(deg=6)</text>
    <text x="585" y="150" class="deg-text">(deg=4)</text>
    <text x="390" y="180" class="deg-text">(deg=8)</text>
    <text x="525" y="245" class="deg-text">(deg=3)</text>

    <!-- Вершины -->
    <g transform="translate(420, 90)"><circle r="14" class="node"/><text class="node-text">V₀</text></g>
    <g transform="translate(500, 50)"><circle r="14" class="node"/><text class="node-text">V₁</text></g>
    <g transform="translate(570, 85)"><circle r="14" class="node"/><text class="node-text">V₂</text></g>
    <g transform="translate(500, 145)"><circle r="14" class="node"/><text class="node-text">V₄</text></g>
    <g transform="translate(420, 195)"><circle r="14" class="node"/><text class="node-text">V₆</text></g>
    <g transform="translate(570, 160)"><circle r="14" class="node"/><text class="node-text">V₃</text></g>
    <g transform="translate(500, 245)"><circle r="14" class="node"/><text class="node-text">V₅</text></g>

    <!-- Сравнение u/v под графом -->
    <line x1="440" y1="340" x2="470" y2="300" class="edge" marker-end="url(#arrow)" />
    <g transform="translate(440, 340)"><circle r="10" class="node"/><text class="node-text" style="font-size: 11px;">u</text></g>
    <g transform="translate(475, 295)"><circle r="10" class="node"/><text class="node-text" style="font-size: 11px;">v</text></g>

    <text x="500" y="325" class="title-text">≠</text>

    <line x1="535" y1="300" x2="505" y2="340" class="edge" marker-end="url(#arrow)" />
    <g transform="translate(535, 295)"><circle r="10" class="node"/><text class="node-text" style="font-size: 11px;">v</text></g>
    <g transform="translate(500, 345)"><circle r="10" class="node"/><text class="node-text" style="font-size: 11px;">u</text></g>

    <text x="500" y="400" class="title-text">b). directed</text>
  </g>
</svg>
