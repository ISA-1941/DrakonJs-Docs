<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Red-Black Tree Experiment</title>
</head>

<body>

<h1>Red-Black Tree — Computational Experiment</h1>

<p>Enter integer values separated by commas:</p>

<input
    id="inputValues"
    type="text"
    value="8, 42, 90"
    size="40"
>

<p>Node to delete:</p>

<input
    id="deleteValue"
    type="number"
    value="8"
>

<br><br>

<button onclick="runExperiment()">Run experiment</button>

<h2>Result</h2>

<pre id="output">The result will appear here.</pre>


<!-- Load the Red-Black Tree program -->
<script src="rbTreeExperiment.js"></script>


<!-- Experiment control -->
<script>

// Capture the output of printTree()
function captureTree(tree) {

    const originalLog = console.log;
    let result = "";

    console.log = function (...args) {
        result += args.join(" ") + "\n";
    };

    try {
        printTree(tree, tree.root);
    }
    finally {
        console.log = originalLog;
    }

    // Remove terminal ANSI color codes
    result = result.replace(/\x1B\[[0-9;]*m/g, "");

    return result;
}


// Run computational experiment
function runExperiment() {

    const output = document.getElementById("output");

    // Read input values
    const values = document
        .getElementById("inputValues")
        .value
        .split(",")
        .map(value => Number(value.trim()));

    // Read the value to delete
    const deleteValue =
        Number(document.getElementById("deleteValue").value);

    // Create Red-Black Tree
    const tree = makeRBTree();

    // Insert values
    for (const value of values) {
        rbInsert(tree, value);
    }

    // Capture tree before deletion
    const before = captureTree(tree);

    // Delete selected node
    deleteNode(tree, deleteValue);

    // Capture tree after deletion
    const after = captureTree(tree);

    // Display result
    output.textContent =
        "TREE BEFORE DELETION\n\n" +
        before +
        "\nDELETE NODE: " + deleteValue + "\n\n" +
        "TREE AFTER DELETION\n\n" +
        after;
}

</script>

</body>
</html>
