<script>
function runExperiment() {

    const output = document.getElementById("output");

    const values = document
        .getElementById("inputValues")
        .value
        .split(",")
        .map(Number);

    const deleteValue =
        Number(document.getElementById("deleteValue").value);

    const tree = makeRBTree();

    // Сохраняем обычный console.log
    const originalLog = console.log;

    let result = "";

    // Временно перенаправляем console.log
    console.log = function (...args) {
        result += args.join(" ") + "\n";
    };

    // Создаём дерево
    for (const value of values) {
        rbInsert(tree, value);
    }

    result += "\nTREE BEFORE DELETION\n\n";

    // ВАША функция
    printTree(tree, tree.root);

    result += "\nDELETE NODE: " + deleteValue + "\n\n";

    // ВАША функция
    deleteNode(tree, deleteValue);

    result += "\nTREE AFTER DELETION\n\n";

    // ВАША функция
    printTree(tree, tree.root);

    // Возвращаем console.log в нормальное состояние
    console.log = originalLog;

    // Показываем накопленный результат на странице
    output.textContent = result;
}
</script>
